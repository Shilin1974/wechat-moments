<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fff;
    width: 375px;
    overflow-x: hidden;
    padding-top: 16px;
  }

  /* 顶部导航栏 */
  .navbar {
    background: #EDEDED;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
    color: #000;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  /* 朋友圈内容区 */
  .moment {
    padding: 12px 12px 12px 58px;
    position: relative;
    border-bottom: 0.5px solid #ECECEC;
    min-height: 80px;
  }

  /* 底部留白，让内容不被截断 */
  .spacer {
    height: 16px;
  }

  /* 头像 */
  .avatar {
    position: absolute;
    left: 12px;
    top: 12px;
    width: 40px;
    height: 40px;
    border-radius: 4px;
    object-fit: cover;
    background: #ddd;
  }

  /* 昵称 */
  .nickname {
    font-size: 15px;
    font-weight: 500;
    color: #576B95;
    margin-bottom: 4px;
    line-height: 1.3;
  }

  /* 正文 */
  .content {
    font-size: 15px;
    color: #333;
    line-height: 1.5;
    margin-bottom: 8px;
    word-break: break-word;
    white-space: pre-wrap;
  }

  /* 配图区域 */
  .images {
    margin-bottom: 8px;
  }

  /* 单张大图 */
  .images.single {
    max-width: 200px;
  }
  .images.single img {
    width: 100%;
    border-radius: 4px;
    display: block;
  }

  /* 多图网格 */
  .images.grid {
    display: grid;
    gap: 4px;
    max-width: 270px;
  }
  .images.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .images.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

  .images.grid img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 2px;
    display: block;
    background: #f0f0f0;
  }

  /* 底部信息 */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #B2B2B2;
  }
  .time-text {
    font-size: 12px;
    color: #B2B2B2;
  }
  .action-btn {
    width: 28px;
    height: 20px;
    background: #F7F7F7;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-btn::after {
    content: "···";
    font-size: 14px;
    font-weight: 700;
    color: #576B95;
    letter-spacing: 1px;
  }

  /* 点赞评论区 */
  .interaction {
    margin-top: 6px;
    background: #F7F7F7;
    border-radius: 3px;
    padding: 6px 8px;
    font-size: 13px;
  }
  .likes {
    color: #576B95;
    line-height: 1.5;
    padding-bottom: 4px;
    border-bottom: 0.5px solid #ECECEC;
  }
  .likes .heart {
    color: #576B95;
    margin-right: 4px;
  }
  .comments {
    padding-top: 4px;
  }
  .comment-item {
    line-height: 1.5;
    margin-bottom: 2px;
  }
  .comment-item .commenter {
    color: #576B95;
    font-weight: 500;
  }
  .comment-item .comment-text {
    color: #333;
  }

  /* 无图时隐藏images区域 */
  .images:empty {
    display: none;
  }
</style>
</head>
<body>

<div class="navbar">朋友圈</div>

<div class="moment">
  <img class="avatar" id="avatar" src="" alt="头像">
  <div class="nickname" id="nickname"></div>
  <div class="content" id="content"></div>
  <div class="images" id="images"></div>
  <div class="footer">
    <span class="time-text" id="time-text"></span>
    <div class="action-btn"></div>
  </div>
</div>
<div class="spacer"></div>

<script>
  // 从URL参数读取数据
  function getParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      content: params.get('content') || '',
      nickname: params.get('nickname') || '于否',
      avatar: params.get('avatar') || 'https://shilin1974.github.io/wechat-moments/avatar.jpg',
      images: params.get('images') ? params.get('images').split(',').filter(Boolean) : []
    };
  }

  // 设置文本内容（防XSS）
  function setText(id, text) {
    document.getElementById(id).textContent = text;
  }

  // 渲染配图
  function renderImages(images) {
    const container = document.getElementById('images');
    if (!images || images.length === 0) return;

    if (images.length === 1) {
      container.className = 'images single';
      const img = document.createElement('img');
      img.src = images[0];
      container.appendChild(img);
    } else {
      const cols = images.length <= 4 ? 2 : 3;
      container.className = 'images grid cols-' + cols;
      images.forEach(function(src) {
        const img = document.createElement('img');
        img.src = src;
        container.appendChild(img);
      });
    }
  }

  // 设置时间（强制北京时间 UTC+8）
  function setTime() {
    const utc = new Date().getTime() + new Date().getTimezoneOffset() * 60000;
    const now = new Date(utc + 8 * 3600000);
    const hours = now.getHours();
    let period = '';
    if (hours < 6) period = '凌晨';
    else if (hours < 9) period = '早上';
    else if (hours < 12) period = '上午';
    else if (hours < 14) period = '中午';
    else if (hours < 18) period = '下午';
    else period = '晚上';

    const minutes = now.getMinutes().toString().padStart(2, '0');
    setText('time-text', period + hours + ':' + minutes);
  }

  // 初始化
  function init() {
    const data = getParams();
    setText('nickname', data.nickname);
    setText('content', data.content);

    if (data.avatar) {
      document.getElementById('avatar').src = data.avatar;
    }

    renderImages(data.images);
    setTime();
  }

  init();
</script>

</body>
</html>
