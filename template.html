<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fff;
    width: 375px;
    overflow-x: hidden;
  }

  /* 封面图区域 */
  .cover {
    position: relative;
    width: 375px;
    height: 280px;
    background: #ddd;
    overflow: hidden;
  }
  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 封面底部的用户信息 */
  .profile {
    position: absolute;
    right: 12px;
    bottom: 16px;
    display: flex;
    align-items: center;
    flex-direction: row-reverse;
  }
  .profile-avatar {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    border: 2px solid #fff;
    object-fit: cover;
    background: #ddd;
    flex-shrink: 0;
  }
  .profile-name {
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    margin-right: 10px;
    line-height: 1.2;
  }

  /* 导航栏 */
  .navbar {
    background: #EDEDED;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
    color: #000;
  }

  /* 朋友圈内容区 */
  .moment {
    padding: 12px 12px 12px 58px;
    position: relative;
    border-bottom: 0.5px solid #ECECEC;
    min-height: 80px;
  }

  /* 底部留白 */
  .spacer {
    height: 16px;
  }

  /* 头像 */
  .avatar {
    position: absolute;
    left: 12px;
    top: 12px;
    width: 40px;
    height: 40px;
    border-radius: 4px;
    object-fit: cover;
    background: #ddd;
  }

  /* 昵称 */
  .nickname {
    font-size: 15px;
    font-weight: 500;
    color: #576B95;
    margin-bottom: 4px;
    line-height: 1.3;
  }

  /* 正文 */
  .content {
    font-size: 15px;
    color: #333;
    line-height: 1.5;
    margin-bottom: 8px;
    word-break: break-word;
    white-space: pre-wrap;
  }

  /* 配图区域 */
  .images {
    margin-bottom: 8px;
  }

  /* 单张大图 */
  .images.single {
    max-width: 200px;
  }
  .images.single img {
    width: 100%;
    border-radius: 4px;
    display: block;
  }

  /* 多图网格 */
  .images.grid {
    display: grid;
    gap: 4px;
    max-width: 270px;
  }
  .images.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .images.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

  .images.grid img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 2px;
    display: block;
    background: #f0f0f0;
  }

  /* 底部信息 */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #B2B2B2;
  }
  .time-text {
    font-size: 12px;
    color: #B2B2B2;
  }
  .action-btn {
    width: 28px;
    height: 20px;
    background: #F7F7F7;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-btn::after {
    content: "···";
    font-size: 14px;
    font-weight: 700;
    color: #576B95;
    letter-spacing: 1px;
  }

  /* 无图时隐藏 */
  .images:empty {
    display: none;
  }
</style>
</head>
<body>

<!-- 封面图 -->
<div class="cover">
  <img id="cover-img" src="https://shilin1974.github.io/wechat-moments/cover.jpg" alt="封面">
  <div class="profile">
    <img class="profile-avatar" id="profile-avatar" src="" alt="头像">
    <span class="profile-name" id="profile-name"></span>
  </div>
</div>

<!-- 导航栏 -->
<div class="navbar">朋友圈</div>

<!-- 朋友圈动态 -->
<div class="moment">
  <img class="avatar" id="avatar" src="" alt="头像">
  <div class="nickname" id="nickname"></div>
  <div class="content" id="content"></div>
  <div class="images" id="images"></div>
  <div class="footer">
    <span class="time-text" id="time-text"></span>
    <div class="action-btn"></div>
  </div>
</div>
<div class="spacer"></div>

<script>
  function getParams() {
    var params = new URLSearchParams(window.location.search);
    return {
      content: params.get('content') || '',
      nickname: params.get('nickname') || '于否',
      avatar: params.get('avatar') || 'https://shilin1974.github.io/wechat-moments/avatar.jpg',
      cover: params.get('cover') || '',
      images: params.get('images') ? params.get('images').split(',').filter(Boolean) : []
    };
  }

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function renderImages(imageList) {
    var container = document.getElementById('images');
    if (!imageList || imageList.length === 0) return;

    if (imageList.length === 1) {
      container.className = 'images single';
      var img = document.createElement('img');
      img.src = imageList[0];
      container.appendChild(img);
    } else {
      var cols = imageList.length <= 4 ? 2 : 3;
      container.className = 'images grid cols-' + cols;
      for (var i = 0; i < imageList.length; i++) {
        var img = document.createElement('img');
        img.src = imageList[i];
        container.appendChild(img);
      }
    }
  }

  function setTime() {
    var now = new Date();
    var utcTime = now.getTime() + now.getTimezoneOffset() * 60000;
    var bjTime = new Date(utcTime + 8 * 3600000);
    var hours = bjTime.getHours();
    var minutes = bjTime.getMinutes().toString().padStart(2, '0');

    var period = '晚上';
    if (hours < 6) period = '凌晨';
    else if (hours < 9) period = '早上';
    else if (hours < 12) period = '上午';
    else if (hours < 14) period = '中午';
    else if (hours < 18) period = '下午';

    setText('time-text', period + hours + ':' + minutes);
  }

  function init() {
    var data = getParams();

    // 封面区域的头像和昵称
    setText('profile-name', data.nickname);
    document.getElementById('profile-avatar').src = data.avatar;

    // 封面图（支持自定义）
    if (data.cover) {
      document.getElementById('cover-img').src = data.cover;
    }

    // 动态区域
    setText('nickname', data.nickname);
    setText('content', data.content);
    document.getElementById('avatar').src = data.avatar;

    renderImages(data.images);
    setTime();
  }

  init();
</script>

</body>
</html>
